{% extends "layout.html" %}

{% block content %}

<h2>Selección de Equipos y Partidas</h2>
<table>
    <tr>
        <td><label for="equipoA">Equipo A:</label></td>
        <td>
            <select id="equipoA">
                <option value="">Selecciona un equipo</option>
                <!-- Equipos se cargarán dinámicamente desde Python -->
            </select>
        </td>
        <td><label for="equipoB">Equipo B:</label></td>
        <td>
            <select id="equipoB">
                <option value="">Selecciona un equipo</option>
                <!-- Equipos se cargarán dinámicamente desde Python -->
            </select>
        </td>
    </tr>
    <tr>
        <td><label for="partidas">Número de partidas:</label></td>
        <td colspan="3">
            <input type="number" id="partidas" min="1" step="1">
        </td>
    </tr>
</table>
<button onclick="predecir()">Predecir</button>
<p id="resultado"></p>

<script>
    function predecir() {
        // Llamada a la API Flask para hacer la predicción
        fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                equipoA: document.getElementById('equipoA').value,
                equipoB: document.getElementById('equipoB').value,
                partidas: parseInt(document.getElementById('partidas').value)
            })
        }).then(response => response.json())
            .then(data => {
                document.getElementById('resultado').innerText = 'Resultado: ' + data.prediccion;
            });
    }
</script>

{% endblock %}
